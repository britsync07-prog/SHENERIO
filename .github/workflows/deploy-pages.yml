name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Configure Cloudflare credentials
        run: |
          mkdir -p "$HOME/.config/.wrangler/config"
          echo "${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_B64 }}" | base64 --decode > "$HOME/.config/.wrangler/config/default.toml"
      - uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name shenerio --branch main
